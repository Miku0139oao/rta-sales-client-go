name: release

# CI builds unsigned Windows portable artifacts into a DRAFT only.
# Publish signed artifacts locally with scripts/publish-portable.ps1.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable tag to stage as draft (must match productVersion)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: "1.25.13"
  BUN_VERSION: "1.3.14"
  WAILS_VERSION: "v3.0.0-beta.8"

jobs:
  portable-draft:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Validate tag and commit
        shell: pwsh
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ($env:TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Not a stable tag' }
          $version = (Get-Content cmd/rta-excel-filler/wails.json -Raw | ConvertFrom-Json).info.productVersion
          if ($env:TAG -cne "v$version") { throw 'Tag/version mismatch' }
          $tagCommit = git rev-parse --verify "$($env:TAG)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Missing tag' }
          $headCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $headCommit) { throw 'Tag/HEAD mismatch' }
      - run: go test ./...
      - run: go vet ./...
      - name: Verify frontend
        working-directory: desktop/frontend
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run verify
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Build unsigned portable artifact
        shell: pwsh
        env:
          RTA_SIGN_SKIP: "1"
        run: ./scripts/build-desktop.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-portable-unsigned
          path: |
            release/RTA-Excel-Filler-portable.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Stage new draft only (never modify historical releases)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $existing = gh release view $env:TAG --repo Miku0139oao/rta-sales-client-go --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to modify it' }
          gh release create $env:TAG release/RTA-Excel-Filler-portable.exe release/SHA256SUMS.txt --repo Miku0139oao/rta-sales-client-go --draft --verify-tag --title "RTA sales $env:TAG (unsigned draft)" --notes 'Unsigned CI staging only. Do not publish before local signed artifact validation.'
          if ($LASTEXITCODE -ne 0) { throw 'Draft staging failed' }
