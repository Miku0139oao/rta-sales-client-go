name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Keep this pin in lockstep with the go directive in go.mod. 1.25.0 has
# stdlib CVEs already fixed in 1.25.13; do not drop back to an unpatched patch.
env:
  GO_VERSION: "1.25.13"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: go test -race ./...
      - run: go vet ./...
      - name: Verify Svelte frontend
        working-directory: desktop/frontend
        run: |
          bun install --frozen-lockfile
          bun run verify

  vulnerability-scan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go version
      # Wails GTK is Windows-only in this repo. Scanning ./... on Linux still
      # tried to typecheck wails linux CGO before cmd/rta-excel-filler was
      # tagged windows. Keep the scan on packages the Linux toolchain builds.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 $(go list ./...)

  desktop-windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install pinned Wails v3 CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.8
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --version 3.12.0 --no-progress --yes
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build portable executable and NSIS installer
        shell: pwsh
        run: ./scripts/build-desktop.ps1
      - name: Confirm installer product metadata
        shell: pwsh
        run: |
          $setup = Get-Item -LiteralPath release/RTA-Excel-Filler-setup.exe
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($setup.FullName)
          if ($info.ProductName -ne 'RTA 銷售分析') {
            throw "installer ProductName is '$($info.ProductName)', expected 'RTA 銷售分析'"
          }
          if ($info.ProductVersion -notlike '0.4.4*') {
            throw "installer ProductVersion is '$($info.ProductVersion)', expected 0.4.4"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RTA-Excel-Filler-windows-amd64
          path: |
            release/RTA-Excel-Filler-setup.exe
            release/RTA-Excel-Filler-portable.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
