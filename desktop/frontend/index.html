<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem('rta-sales-desktop-settings-v1') || '{}');
          const preference = saved.theme === 'light' || saved.theme === 'dark' ? saved.theme : 'system';
          const theme = preference === 'system'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : preference;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#0f1217' : '#f4f6f8');
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>RTA 銷售資料填入工具</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
